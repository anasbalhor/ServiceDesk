services:
  postgres:
    image: postgres:16
    restart: always
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - servicesdesk_network

networks:
  servicesdesk_network:
    driver: bridge

volumes:
  postgres_data: